version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: quanta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: quanta_share
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quanta_share"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: quanta_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@db:5432/quanta_share
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      NUWAX_API_KEY: ${NUWAX_API_KEY:-}
      NUWAX_BASE_URL: ${NUWAX_BASE_URL:-https://nuwax.com}
      NUWAX_AGENT_ID: ${NUWAX_AGENT_ID:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      GITHUB_MODELS_API_KEY: ${GITHUB_MODELS_API_KEY:-}
      GITHUB_MODELS_BASE_URL: ${GITHUB_MODELS_BASE_URL:-https://models.github.ai/inference}
      GITHUB_MODELS_MODEL: ${GITHUB_MODELS_MODEL:-openai/gpt-4o}
      GITHUB_MODELS_TIMEOUT_SECONDS: ${GITHUB_MODELS_TIMEOUT_SECONDS:-60}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500,null}
      BILLING_PUBLIC_BASE_URL: ${BILLING_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      ZHIFUFM_API_URL: ${ZHIFUFM_API_URL:-}
      ZHIFUFM_MERCHANT_NUM: ${ZHIFUFM_MERCHANT_NUM:-}
      ZHIFUFM_SECRET: ${ZHIFUFM_SECRET:-}
      ZHIFUFM_PAY_TYPE: ${ZHIFUFM_PAY_TYPE:-aloop}
      ZHIFUFM_NOTIFY_URL: ${ZHIFUFM_NOTIFY_URL:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-change_me_admin_secret}
    ports:
      - "8000:8000"
    volumes:
      - ./前端:/前端
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for DB..."
        sleep 3
        python run_sql_migrations.py
        uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:

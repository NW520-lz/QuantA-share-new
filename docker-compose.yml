version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: quanta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请设置DB_PASSWORD环境变量}
      POSTGRES_DB: quanta_share
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quanta_share"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: quanta_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:?请设置DB_PASSWORD}@db:5432/quanta_share
      JWT_SECRET: ${JWT_SECRET:?请设置JWT_SECRET环境变量}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500}
      ADMIN_SECRET: ${ADMIN_SECRET:?请设置ADMIN_SECRET环境变量}
    ports:
      - "8000:8000"
    volumes:
      - ./前端:/前端
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for DB..."
        sleep 3
        python run_sql_migrations.py
        uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:

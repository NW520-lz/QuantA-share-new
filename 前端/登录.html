<!doctype html>

<html class="dark" lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>女娲量化 | 机构级智能量化分析平台</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "surface-container-lowest": "#0e0e10",
                            "on-tertiary-container": "#9d7b5a",
                            "tertiary-container": "#281400",
                            "on-secondary-container": "#bab8b7",
                            "surface-bright": "#39393b",
                            "secondary-fixed-dim": "#c8c6c5",
                            "on-error-container": "#ffdad6",
                            "surface-container-low": "#1b1b1d",
                            "on-surface": "#e4e2e4",
                            "on-tertiary": "#432b10",
                            "secondary-fixed": "#e5e2e1",
                            "on-tertiary-fixed": "#2b1701",
                            "inverse-primary": "#515f78",
                            "surface-container-highest": "#343536",
                            outline: "#8f9097",
                            "tertiary-fixed-dim": "#e7bf99",
                            "surface-container": "#1f1f21",
                            "on-secondary-fixed": "#1c1b1b",
                            "surface-dim": "#131315",
                            "error-container": "#93000a",
                            "primary-fixed-dim": "#b9c7e4",
                            "outline-variant": "#44474d",
                            background: "#131315",
                            "on-primary-fixed": "#0d1c32",
                            "inverse-on-surface": "#303032",
                            "secondary-container": "#4a4949",
                            secondary: "#c8c6c5",
                            "on-tertiary-fixed-variant": "#5d4124",
                            "on-error": "#690005",
                            "surface-variant": "#343536",
                            "on-secondary-fixed-variant": "#474646",
                            "primary-fixed": "#d6e3ff",
                            "on-secondary": "#313030",
                            surface: "#131315",
                            "surface-tint": "#b9c7e4",
                            error: "#ffb4ab",
                            tertiary: "#e7bf99",
                            "primary-container": "#0a192f",
                            "on-surface-variant": "#c5c6cd",
                            "on-primary": "#233148",
                            "inverse-surface": "#e4e2e4",
                            "tertiary-fixed": "#ffdcbd",
                            "on-primary-fixed-variant": "#39475f",
                            "on-primary-container": "#74829d",
                            "surface-container-high": "#2a2a2c",
                            "on-background": "#e4e2e4",
                            primary: "#b9c7e4",
                            success: "#4ade80",
                            "on-success": "#052e16",
                        },
                        borderRadius: {
                            DEFAULT: "0.125rem",
                            lg: "0.25rem",
                            xl: "0.5rem",
                            full: "0.75rem",
                        },
                        spacing: {
                            unit: "4px",
                            "container-padding": "1.5rem",
                            "compact-padding": "0.5rem",
                            gutter: "1rem",
                            "table-row-height": "32px",
                        },
                        fontFamily: {
                            "label-xs": ["JetBrains Mono"],
                            "headline-md": ["Inter"],
                            "data-tabular": ["Inter"],
                            "display-lg": ["Inter"],
                            "body-md": ["Inter"],
                        },
                        fontSize: {
                            "label-xs": [
                                "11px",
                                {
                                    lineHeight: "14px",
                                    letterSpacing: "0.05em",
                                    fontWeight: "500",
                                },
                            ],
                            "headline-md": [
                                "20px",
                                {
                                    lineHeight: "28px",
                                    letterSpacing: "-0.01em",
                                    fontWeight: "600",
                                },
                            ],
                            "data-tabular": [
                                "13px",
                                { lineHeight: "16px", fontWeight: "500" },
                            ],
                            "display-lg": [
                                "30px",
                                {
                                    lineHeight: "38px",
                                    letterSpacing: "-0.02em",
                                    fontWeight: "700",
                                },
                            ],
                            "body-md": [
                                "14px",
                                { lineHeight: "20px", fontWeight: "400" },
                            ],
                        },
                    },
                },
            };
        </script>
        <style>
            body {
                background-color: #0e0e10;
                margin: 0;
                overflow: hidden;
            }
            .data-grid-overlay {
                background-image:
                    linear-gradient(rgba(51, 65, 85, 0.1) 1px, transparent 1px),
                    linear-gradient(
                        90deg,
                        rgba(51, 65, 85, 0.1) 1px,
                        transparent 1px
                    );
                background-size: 40px 40px;
            }
            .glow-effect {
                box-shadow: 0 0 20px rgba(74, 222, 128, 0.1);
            }
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 300,
                    "GRAD" 0,
                    "opsz" 24;
            }
        </style>
    </head>
    <body
        class="font-body-md text-on-surface flex items-center justify-center min-h-screen relative"
    >
        <!-- Background Layer -->
        <div class="absolute inset-0 z-0 bg-[#0e0e10]">
            <div class="absolute inset-0 data-grid-overlay opacity-40"></div>
            <div
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[600px] bg-primary-container/10 blur-[120px] rounded-full"
            ></div>
            <!-- Abstract Wave Decoration -->
            <div
                class="absolute bottom-0 left-0 w-full h-1/3 opacity-20 pointer-events-none"
            >
                <svg class="w-full h-full preserve-3d" viewbox="0 0 1440 320">
                    <path
                        d="M0,160L48,176C96,192,192,224,288,224C384,224,480,192,576,165.3C672,139,768,117,864,138.7C960,160,1056,224,1152,245.3C1248,267,1344,245,1392,234.7L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"
                        fill="#b9c7e4"
                        fill-opacity="0.1"
                    ></path>
                </svg>
            </div>
        </div>
        <!-- Login Container -->
        <main class="relative z-10 w-full max-w-[420px] px-6">
            <div
                class="bg-surface-container border border-outline-variant p-8 rounded-lg shadow-2xl backdrop-blur-md"
            >
                <!-- Header Identity -->
                <div class="text-center mb-10">
                    <div class="flex items-center justify-center gap-3 mb-2">
                        <div
                            class="w-10 h-10 bg-primary-container flex items-center justify-center rounded-lg border border-primary/30"
                        >
                            <span
                                class="material-symbols-outlined text-primary text-2xl"
                                style="
                                    font-variation-settings: &quot;FILL&quot; 1;
                                "
                                >query_stats</span
                            >
                        </div>
                        <h1
                            class="font-headline-md text-headline-md text-primary tracking-wider"
                        >
                            女娲量化
                        </h1>
                    </div>
                    <p
                        class="font-label-xs text-label-xs text-on-surface-variant uppercase tracking-[0.2em]"
                    >
                        机构级智能量化分析平台
                    </p>
                </div>
                <!-- Login Form -->
                <form class="space-y-6" id="login-form" onsubmit="return false;">
                    <!-- UID Input -->
                    <div class="space-y-1.5">
                        <label
                            class="font-label-xs text-label-xs text-on-surface-variant ml-1"
                            >UID / 手机号</label
                        >
                        <div class="relative group">
                            <span
                                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg"
                                >person</span
                            >
                            <input
                                class="w-full bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded py-2.5 pl-10 pr-4 text-on-surface font-body-md transition-all outline-none"
                                id="login-account"
                                placeholder="输入您的账号"
                                type="text"
                            />
                        </div>
                    </div>
                    <!-- Password Input -->
                    <div class="space-y-1.5">
                        <label
                            class="font-label-xs text-label-xs text-on-surface-variant ml-1"
                            >登录密码</label
                        >
                        <div class="relative group">
                            <span
                                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg"
                                >lock</span
                            >
                            <input
                                class="w-full bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded py-2.5 pl-10 pr-10 text-on-surface font-body-md transition-all outline-none"
                                id="password-input"
                                placeholder="输入密码"
                                type="password"
                            />
                            <button
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors"
                                onclick="togglePassword()"
                                type="button"
                            >
                                <span
                                    class="material-symbols-outlined text-lg"
                                    id="password-toggle-icon"
                                    >visibility</span
                                >
                            </button>
                        </div>
                    </div>
                    <!-- Options Row -->
                    <div
                        class="flex items-center justify-between font-label-xs text-label-xs text-on-surface-variant px-1"
                    >
                        <label
                            class="flex items-center gap-2 cursor-pointer group"
                        >
                            <input
                                class="w-3.5 h-3.5 rounded-sm bg-surface-container-low border-outline-variant text-primary focus:ring-offset-surface focus:ring-primary transition-all"
                                type="checkbox"
                            />
                            <span
                                class="group-hover:text-on-surface transition-colors"
                                >记住密码</span
                            >
                        </label>
                        <label
                            class="flex items-center gap-2 cursor-pointer group"
                        >
                            <input
                                class="w-3.5 h-3.5 rounded-sm bg-surface-container-low border-outline-variant text-primary focus:ring-offset-surface focus:ring-primary transition-all"
                                type="checkbox"
                            />
                            <span
                                class="group-hover:text-on-surface transition-colors"
                                >自动登录</span
                            >
                        </label>
                    </div>
                    <!-- Login Button -->
                    <p
                        class="text-error text-label-xs text-label-xs hidden"
                        id="login-error"
                    ></p>
                    <button
                        class="w-full bg-success hover:bg-success/90 text-on-success font-headline-md text-headline-md py-3 rounded-lg transition-all active:scale-[0.98] shadow-lg shadow-success/10 font-bold"
                        id="login-submit"
                    >
                        立即登录
                    </button>
                    <!-- Footer Links -->
                    <div class="flex items-center justify-center gap-6 pt-2">
                        <a
                            class="font-label-xs text-label-xs text-on-surface-variant hover:text-primary transition-colors"
                            href="#"
                            >忘记密码？</a
                        >
                        <span
                            class="w-1 h-1 rounded-full bg-outline-variant"
                        ></span>
                        <a
                            class="font-label-xs text-label-xs text-primary hover:underline transition-all"
                            href="注册.html"
                            >邮箱注册</a
                        >
                    </div>
                </form>
            </div>
        </main>
        <!-- Global Footer Branding -->
        <footer
            class="fixed bottom-6 left-0 w-full px-container-padding flex flex-col md:flex-row items-center justify-between text-on-surface-variant/60 font-label-xs text-label-xs z-20 pointer-events-none"
        >
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span
                        class="w-2 h-2 rounded-full bg-success animate-pulse"
                    ></span>
                    <span>核心服务器: <span data-status>稳定</span></span>
                </div>
                <span class="text-outline-variant opacity-30">|</span>
                <span class="font-label-xs">V2.4 Institutional</span>
            </div>
            <div class="mt-4 md:mt-0 opacity-40">
                © 2024 QUANT ENGINE TECH. ALL RIGHTS RESERVED.
            </div>
        </footer>
        <script>
            function togglePassword() {
                const input = document.getElementById("password-input");
                const icon = document.getElementById("password-toggle-icon");
                if (input.type === "password") {
                    input.type = "text";
                    icon.innerText = "visibility_off";
                } else {
                    input.type = "password";
                    icon.innerText = "visibility";
                }
            }
        </script>
        <script type="module" src="./js/auth.js"></script>
    </body>
</html>

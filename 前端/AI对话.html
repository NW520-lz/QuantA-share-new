<!doctype html>
<html class="dark" lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>QuantA-Share | AI 对话</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "primary-container": "#0a192f",
                            primary: "#b9c7e4",
                            "error-container": "#93000a",
                            "surface-container-lowest": "#0e0e10",
                            surface: "#131315",
                            "surface-variant": "#343536",
                            "surface-container": "#1f1f21",
                            "outline-variant": "#44474d",
                            background: "#131315",
                            "on-surface": "#e4e2e4",
                            "on-surface-variant": "#c5c6cd",
                        },
                        borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
                        spacing: { gutter: "1rem", "container-padding": "1.5rem", unit: "4px", "table-row-height": "32px" },
                        fontFamily: { "display-lg": ["Inter"], "body-md": ["Inter"], "label-xs": ["JetBrains Mono"] },
                    },
                },
            };
        </script>
        <style>
            body { background-color: #131315; color: #e4e2e4; overflow-x: hidden; }
            .custom-scrollbar::-webkit-scrollbar { width: 4px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
            .ai-bubble { background: linear-gradient(135deg, #1f1f21 0%, #0a192f 100%); border: 1px solid #334155; }
            .ai-prose h2, .ai-prose h3, .ai-prose h4 { margin-top: 1.2rem; margin-bottom: 0.5rem; color: #b9c7e4; }
            .ai-prose ul, .ai-prose ol { padding-left: 1.5rem; margin: 0.5rem 0; list-style-type: disc; }
            .ai-prose ol { list-style-type: decimal; }
            .ai-prose li { margin-bottom: 0.25rem; }
            .ai-prose strong { color: #e4e2e4; font-weight: 600; }
            .ai-prose code { background: #1f1f21; color: #b9c7e4; padding: 2px 6px; border-radius: 3px; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
            .ai-prose hr { border-color: #334155; margin: 1rem 0; }
            .ai-prose p { margin-bottom: 0.75rem; line-height: 1.6; }
            .ai-prose pre { background: #0e0e10; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 1rem 0; border: 1px solid #334155; }
            .typing-indicator { display: inline-flex; align-items: center; gap: 2px; }
            .typing-dot { width: 4px; height: 4px; background: #b9c7e4; border-radius: 50%; animation: typing 1.4s infinite; }
            .typing-dot:nth-child(2) { animation-delay: 0.2s; }
            .typing-dot:nth-child(3) { animation-delay: 0.4s; }
            @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>
    <body class="font-body-md text-body-md">
        <main class="lg:ml-64 flex flex-col min-h-screen lg:h-screen pt-12">
            <div class="flex-1 overflow-visible lg:overflow-hidden flex flex-col lg:flex-row p-3 lg:p-4 gap-3 lg:gap-4 bg-background">
                <!-- Chat Interface -->
                <div class="flex-1 flex flex-col bg-surface-container rounded-xl border border-outline-variant/30 shadow-2xl relative overflow-hidden">
                    <div class="absolute inset-0 opacity-[0.03] pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
                    
                    <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar scroll-smooth" id="chat-messages">
                        <!-- Welcome Message -->
                        <div class="flex gap-4 items-start">
                            <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center flex-shrink-0 shadow-lg shadow-primary/10">
                                <span class="material-symbols-outlined text-on-primary text-[18px]">memory</span>
                            </div>
                            <div class="max-w-[85%] ai-bubble p-5 rounded-2xl rounded-tl-none shadow-xl border border-outline-variant/20">
                                <h3 class="text-primary font-bold text-headline-md mb-2">Quant Engine AI V2.4</h3>
                                <p class="text-on-surface-variant leading-relaxed mb-4">
                                    您好！我是您的智能交易顾问。我可以为您提供全市场扫描分析、个股诊断、策略参数优化建议。
                                </p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <button class="flex items-center gap-2 p-3 rounded-lg bg-surface-container-highest/50 border border-outline-variant/30 hover:border-primary/50 hover:bg-primary/5 transition-all group" data-quick-action="pick_now">
                                        <span class="material-symbols-outlined text-primary text-[20px]">rocket_launch</span>
                                        <div class="text-left">
                                            <div class="text-label-xs font-bold text-on-surface group-hover:text-primary transition-colors">立即选股</div>
                                            <div class="text-[10px] text-on-surface-variant">获取高胜率标的</div>
                                        </div>
                                    </button>
                                    <button class="flex items-center gap-2 p-3 rounded-lg bg-surface-container-highest/50 border border-outline-variant/30 hover:border-primary/50 hover:bg-primary/5 transition-all group" data-quick-action="empty_or_hold">
                                        <span class="material-symbols-outlined text-primary text-[20px]">Query_stats</span>
                                        <div class="text-left">
                                            <div class="text-label-xs font-bold text-on-surface group-hover:text-primary transition-colors">大盘研判</div>
                                            <div class="text-[10px] text-on-surface-variant">判断空仓/持仓</div>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Input Area -->
                    <div class="p-4 bg-surface border-t border-outline-variant/30">
                        <div class="relative flex items-end gap-2 bg-surface-container-low p-2 rounded-xl border border-outline-variant focus-within:border-primary/50 transition-all shadow-inner">
                            <textarea
                                class="flex-1 bg-transparent border-none text-body-md focus:ring-0 resize-none py-2 px-3 max-h-40 custom-scrollbar text-on-surface"
                                id="chat-input"
                                placeholder="输入您的问题，如：分析 sh.600519 的趋势..."
                                rows="1"
                            ></textarea>
                            <button class="p-2 rounded-lg bg-primary text-on-primary hover:bg-primary-fixed hover:scale-105 active:scale-95 transition-all shadow-lg disabled:opacity-50" id="chat-send">
                                <span class="material-symbols-outlined text-[20px]">send</span>
                            </button>
                        </div>
                        <div class="mt-2 flex justify-between items-center px-1">
                            <div class="flex gap-4">
                                <button class="text-[10px] text-on-surface-variant hover:text-primary flex items-center gap-1 transition-colors" data-quick-action="analyze_stock">
                                    <span class="material-symbols-outlined text-[14px]">analytics</span> 个股诊断
                                </button>
                                <button class="text-[10px] text-on-surface-variant hover:text-primary flex items-center gap-1 transition-colors" data-quick-action="optimize_params">
                                    <span class="material-symbols-outlined text-[14px]">tune</span> 策略优化
                                </button>
                            </div>
                            <div class="text-[10px] text-on-surface-variant/40">Powered by Quant Engine Institutional V2.4</div>
                        </div>
                    </div>
                </div>

                <!-- Right Sidebar: Quick Nav + System Logs -->
                <aside class="w-full lg:w-80 flex flex-col gap-4">
                    <!-- Quick Navigation Panel -->
                    <div class="bg-surface-container rounded-xl border border-outline-variant/30 flex flex-col overflow-hidden shadow-xl">
                        <div class="p-3 border-b border-outline-variant/30 flex items-center gap-2 bg-surface-container-high/50">
                            <span class="material-symbols-outlined text-primary text-[16px]">open_in_new</span>
                            <h3 class="font-label-xs text-label-xs font-bold text-on-surface uppercase tracking-widest">快捷导航</h3>
                        </div>
                        <div class="grid grid-cols-2 gap-2 p-3">
                            <button class="flex items-center gap-1.5 p-2 rounded-lg bg-surface-container-highest/50 border border-outline-variant/30 hover:border-primary/50 hover:bg-primary/5 transition-all group" onclick="window.location.href='选股看板.html'">
                                <span class="material-symbols-outlined text-primary text-[16px]">dashboard</span>
                                <span class="text-[11px] text-on-surface-variant group-hover:text-primary">选股看板</span>
                            </button>
                            <button class="flex items-center gap-1.5 p-2 rounded-lg bg-surface-container-highest/50 border border-outline-variant/30 hover:border-primary/50 hover:bg-primary/5 transition-all group" onclick="window.location.href='策略参数.html'">
                                <span class="material-symbols-outlined text-primary text-[16px]">settings_input_component</span>
                                <span class="text-[11px] text-on-surface-variant group-hover:text-primary">策略参数</span>
                            </button>
                            <button class="flex items-center gap-1.5 p-2 rounded-lg bg-surface-container-highest/50 border border-outline-variant/30 hover:border-primary/50 hover:bg-primary/5 transition-all group" onclick="window.location.href='持仓风险.html'">
                                <span class="material-symbols-outlined text-primary text-[16px]">security</span>
                                <span class="text-[11px] text-on-surface-variant group-hover:text-primary">持仓风控</span>
                            </button>
                            <button class="flex items-center gap-1.5 p-2 rounded-lg bg-surface-container-highest/50 border border-outline-variant/30 hover:border-primary/50 hover:bg-primary/5 transition-all group" onclick="window.location.href='复盘日志.html'">
                                <span class="material-symbols-outlined text-primary text-[16px]">history_edu</span>
                                <span class="text-[11px] text-on-surface-variant group-hover:text-primary">复盘日志</span>
                            </button>
                            <button class="flex items-center gap-1.5 p-2 rounded-lg bg-surface-container-highest/50 border border-outline-variant/30 hover:border-primary/50 hover:bg-primary/5 transition-all group" onclick="window.location.href='系统设置.html'">
                                <span class="material-symbols-outlined text-primary text-[16px]">settings</span>
                                <span class="text-[11px] text-on-surface-variant group-hover:text-primary">系统配置</span>
                            </button>
                            <button class="flex items-center gap-1.5 p-2 rounded-lg bg-surface-container-highest/50 border border-outline-variant/30 hover:border-primary/50 hover:bg-primary/5 transition-all group" onclick="window.location.href='付费中心.html'">
                                <span class="material-symbols-outlined text-primary text-[16px]">workspace_premium</span>
                                <span class="text-[11px] text-on-surface-variant group-hover:text-primary">付费中心</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex-1 bg-surface-container rounded-xl border border-outline-variant/30 flex flex-col overflow-hidden shadow-xl">
                        <div class="p-4 border-b border-outline-variant/30 flex justify-between items-center bg-surface-container-high/50">
                            <h3 class="font-label-xs text-label-xs font-bold text-on-surface flex items-center gap-2 uppercase tracking-widest">
                                <span class="material-symbols-outlined text-primary text-[18px]">terminal</span>
                                实时策略终端
                            </h3>
                            <div class="flex gap-1">
                                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 font-label-xs text-[11px] leading-relaxed custom-scrollbar bg-black/20" id="log-container">
                            <!-- Logs will be injected here -->
                        </div>
                    </div>
                </aside>
            </div>
        </main>
        <script type="module">
            import { injectLayout } from "./js/layout.js";
            injectLayout();
        </script>
        <script type="module" src="./js/mobile-layout.js"></script>
        <script type="module" src="./js/ai-chat.js"></script>
    </body>
</html>
